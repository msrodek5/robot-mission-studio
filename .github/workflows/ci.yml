name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deploys are handled by Vercel's Git integration (preview per PR, production
# on main). This workflow is the quality gate that must pass alongside it.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Vercel serverless runtime.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

